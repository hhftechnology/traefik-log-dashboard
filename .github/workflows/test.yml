name: Test

on:
  pull_request:
    branches:
      - dev-fix

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'

      - name: Test and build the agent
        working-directory: agent
        run: |
          go test ./...
          go build -o /tmp/traefik-log-dashboard-agent ./cmd/agent

      - name: Test and build the CLI
        working-directory: cli
        run: |
          go test ./...
          go build -o /tmp/traefik-log-dashboard-cli ./cmd/traefik-log-dashboard

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Test and build the dashboard
        working-directory: dashboard
        run: |
          npm test
          npm run build
